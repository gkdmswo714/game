<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>틀 밖으로</title>
<style>
:root{
  --bg:#e8e8e6; --ink:#1b1b1b; --soft:rgba(27,27,27,.45);
  --font:"Cheosgeol-eum","첫걸음","Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block;touch-action:none}

#hud{position:fixed;left:16px;bottom:16px;max-width:min(760px,calc(100vw - 32px));pointer-events:none;
  background:rgba(232,232,230,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(27,27,27,.18);border-radius:22px;padding:10px 12px 12px;transition:opacity .4s}
#hud .top{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--soft);margin:0 2px 8px}
#hud .top b{color:var(--ink);font-weight:600}
#slots{display:flex;flex-wrap:wrap;gap:4px 3px;align-items:center}
.slot{width:26px;height:26px;border-radius:50%;border:1px solid rgba(27,27,27,.55);background:#f1f1ef;
  display:grid;place-items:center;font-size:13px;line-height:1;color:rgba(27,27,27,.22);transition:background .25s,color .25s,transform .25s}
.slot.on{border-color:rgba(27,27,27,.3);animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.gap{width:8px}
.punc{font-size:15px;padding:0 2px;color:var(--soft)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}

#caption{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;
  font-size:clamp(20px,3.6vw,42px);line-height:1.35;letter-spacing:-.01em;width:min(900px,calc(100vw - 32px));
  opacity:0;transition:opacity .7s;text-shadow:0 0 18px var(--bg),0 0 8px var(--bg),0 0 3px var(--bg)}
#caption.show{opacity:1}
#caption small{display:block;font-size:13px;color:var(--soft);margin-bottom:10px;letter-spacing:.08em}

.panel{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .6s;padding:16px}
.panel.hide{opacity:0}
.card{pointer-events:auto;background:rgba(240,240,238,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(27,27,27,.2);border-radius:28px;padding:28px 30px 24px;max-width:460px;text-align:center}
.card h1{margin:0 0 6px;font-size:34px;font-weight:600;letter-spacing:-.02em}
.card p{margin:0 0 6px;font-size:14px;line-height:1.6;color:rgba(27,27,27,.7)}
.card .belief{font-size:16px;line-height:1.7;color:var(--ink);margin:12px 0 14px}
.card ul{list-style:none;padding:0;margin:14px 0 18px;font-size:13px;line-height:1.9;color:rgba(27,27,27,.65)}
button{font:inherit;font-size:15px;border:1px solid var(--ink);background:var(--ink);color:#f1f1ef;border-radius:999px;padding:9px 22px;cursor:pointer}
button:hover{background:#3a3a3a}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(27,27,27,.4)}
#endPanel .card{max-width:620px}
#endPanel .belief{font-size:clamp(16px,2.2vw,21px)}
</style>
</head>
<body>
<canvas id="cv" aria-label="글자 동그라미들 사이를 움직이는 검은 털뭉치"></canvas>

<div id="hud" style="opacity:0">
  <div class="top"><b id="stageNo">1 / 4</b><span id="count"></span><span>· 스페이스: 힌트</span></div>
  <div id="slots"></div>
</div>

<div id="caption"></div>

<div class="panel" id="introPanel">
  <div class="card">
    <div class="dots"><i style="background:#ee8dc6"></i><i style="background:#f4d64a"></i><i style="background:#3f8c62"></i><i style="background:#96b7ef"></i><i style="background:#8a8a8a"></i></div>
    <h1>틀 밖으로</h1>
    <p>정해진 자리에 줄 선 자모들을 깨워 데리고 다니세요.</p>
    <ul>
      <li>마우스·손가락으로 움직이기 (방향키·WASD도 됩니다)</li>
      <li>닿은 자모는 색을 얻고 꼬리가 되어 따라옵니다</li>
      <li>한 글자의 자모를 모두 깨우면 아래 문장에 채워집니다</li>
      <li>문장을 다 채우면 틀이 부서지고 다음 문장으로</li>
      <li>화살표는 사회가 정해 둔 방향 — 닿으면 그쪽으로 떠밀립니다</li>
    </ul>
    <button id="startBtn">시작</button>
  </div>
</div>

<div class="panel hide" id="endPanel" style="display:none">
  <div class="card">
    <div class="belief" id="endText"></div>
    <p>여기서 끝나는 형태는 없습니다. 계속 움직여 보세요.</p>
    <p style="margin-top:14px"><button id="againBtn">처음부터</button></p>
  </div>
</div>

<script>
(()=>{
'use strict';
const BELIEF=[
  '사람은 어디에서나 매순간 변화한다.',
  '사회는 정해진 모습과 틀에 우리를 가두려 하지만,',
  '우리는 그럼에도 틀을 벗어나 계속 변화하는 주체적인 존재다.',
  '그 누구도 우리의 최종 형태를 결정할 수 없다.'
];
const ARROW_RATE=[.16,.32,.22,.12];        // 문장마다 화살표(정해진 방향) 비율
const FONT='"Cheosgeol-eum","첫걸음","Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const COLORS=[
  {f:'#ee8dc6',t:'#1b1b1b'},{f:'#f4d64a',t:'#1b1b1b'},{f:'#3f8c62',t:'#111'},
  {f:'#96b7ef',t:'#1b1b1b'},{f:'#8a8a8a',t:'#1b1b1b'},{f:'#4a4a4a',t:'#ececec'},{f:'#a9d3b7',t:'#1b1b1b'}
];
const COLOR_BAG=[0,0,0,1,1,2,2,3,3,4,4,5,6];
const HANGUL=/[가-힣]/;
/* 음절 → 자모 원들의 자리 (결합된 모양 그대로) */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅗㅏ','ㅗㅐ','ㅗㅣ','ㅛ','ㅜ','ㅜㅓ','ㅜㅔ','ㅜㅣ','ㅠ','ㅡ','ㅡㅣ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄱㅅ','ㄴ','ㄴㅈ','ㄴㅎ','ㄷ','ㄹ','ㄹㄱ','ㄹㅁ','ㄹㅂ','ㄹㅅ','ㄹㅌ','ㄹㅍ','ㄹㅎ','ㅁ','ㅂ','ㅂㅅ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const HORIZ='ㅗㅛㅜㅠㅡ';
function layout(ch){
  const c=ch.charCodeAt(0)-0xAC00;
  const L=CHO[(c/588)|0], V=[...JUNG[((c%588)/28)|0]], T=[...JONG[c%28]], fin=T.length>0, out=[];
  const put=(j,x,y)=>out.push({j,x,y});
  const finals=y=>{if(T.length===1)put(T[0],.5,y);else if(T.length===2){put(T[0],.3,y);put(T[1],.7,y);}};
  if(V.length===2){                       // ㅘ ㅚ ㅢ … : 초성 왼쪽 위, 가로획 아래, 세로획 오른쪽
    if(fin){put(L,.3,.18);put(V[0],.3,.5);put(V[1],.74,.34);finals(.82);}
    else{put(L,.3,.27);put(V[0],.3,.69);put(V[1],.75,.48);}
  }else if(HORIZ.includes(V[0])){          // ㅗ ㅜ ㅡ … : 위아래로 쌓기
    if(fin){put(L,.5,.18);put(V[0],.5,.5);finals(.82);}
    else{put(L,.5,.3);put(V[0],.5,.7);}
  }else{                                   // ㅏ ㅓ ㅣ … : 왼쪽·오른쪽
    if(fin){put(L,.3,.3);put(V[0],.72,.3);finals(.76);}
    else{put(L,.3,.5);put(V[0],.72,.5);}
  }
  return out;
}
const DIRS=[...Array(8)].map((_,i)=>{const a=-Math.PI/2+i*Math.PI/4;return{x:Math.cos(a),y:Math.sin(a),a}});
const SWARM_CAP=190, TRACE_CAP=520, STEP=3, CELL=48;

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=0,H=0,dpr=1,R=28;
let field=[],swarm=[],path=[],slots=[],stage=0,state='intro';
let grid=[],gc=0,gr=0;
let P={x:0,y:0,tx:0,ty:0,vx:0,vy:0,kx:0,ky:0,look:{x:0,y:0},blink:0,nextBlink:2000};
let keys=new Set(), useKeys=false, lastFill=0, clearAt=0, advanced=false, now=0;
const spikes=[...Array(110)].map(()=>({a:Math.random()*Math.PI*2,l:rand(.95,1.28),w:rand(0,6.28)}));

/* ---------- 스프라이트 (글자 동그라미) ---------- */
const SPR=96, RS=SPR/2-3, cache=new Map();
function sprite(kind,ch,ci){
  const key=kind+'|'+ch+'|'+ci;
  let c=cache.get(key); if(c) return c;
  c=document.createElement('canvas'); c.width=c.height=SPR;
  const g=c.getContext('2d'), m=SPR/2;
  g.beginPath(); g.arc(m,m,RS,0,Math.PI*2);
  g.fillStyle=ci<0?'#f2f2f0':COLORS[ci].f; g.fill();
  g.lineWidth=ci<0?3.6:2.4; g.strokeStyle=ci<0?'rgba(30,30,30,.78)':'rgba(30,30,30,.32)'; g.stroke();
  const ink=ci<0?'#1b1b1b':COLORS[ci].t;
  if(kind==='arrow'){
    const d=DIRS[ch]; g.save(); g.translate(m,m); g.rotate(d.a+Math.PI/2);
    g.strokeStyle=ink; g.lineWidth=5.5; g.lineCap='round'; g.lineJoin='round';
    g.beginPath(); g.moveTo(0,RS*.5); g.lineTo(0,-RS*.48); g.moveTo(-RS*.3,-RS*.18); g.lineTo(0,-RS*.5); g.lineTo(RS*.3,-RS*.18); g.stroke();
    g.restore();
  }else{
    g.fillStyle=ink; g.textAlign='center'; g.textBaseline='middle';
    g.font=`${kind==='mark'?RS*1.2:RS*1.05}px ${FONT}`;
    g.fillText(ch,m,m+RS*.07);
  }
  cache.set(key,c); return c;
}
if(document.fonts){document.fonts.ready.then(()=>cache.clear());document.fonts.addEventListener?.('loadingdone',()=>cache.clear());}

/* ---------- 크기 ---------- */
function resize(){
  dpr=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  R=clamp(Math.min(W,H)*.036,20,34);
  gc=Math.ceil(W/CELL)+1; gr=Math.ceil(H/CELL)+1; grid=[...Array(gc*gr)].map(()=>[]);
}

/* ---------- 틀(필드) 만들기 ---------- */
function unfilledChars(){return slots.filter(s=>!s.filled).map(s=>s.ch)}
function buildField(t0){
  const keep=field.filter(t=>t.state!=='field');
  // 글자 한 칸(B) 안에 자모 원들이 결합된 모양으로 놓입니다. 문장이 화면 전체에 줄글처럼 반복됩니다.
  const B=clamp(Math.sqrt(W*H/360),46,66), sx=B*.94, sy=B*1.0;
  const stream=[BELIEF[stage],...BELIEF.filter((_,i)=>i!==stage)].join(' ')+' ';
  const blocks=[]; let k=0;
  for(let y=sy*.55;y<H+sy*.3;y+=sy){
    for(let x=sx*.55;x<W+sx*.3;x+=sx){
      const ch=stream[k++%stream.length];
      blocks.push({x:x-B/2+rand(-.05,.05)*B,y:y-B/2+rand(-.05,.05)*B,ch});
    }
  }
  const away=b=>Math.hypot(b.x+B/2-P.x,b.y+B/2-P.y)>R*2.6;
  const reachable=b=>away(b)&&b.y+B>50&&b.y<H-140;
  // 아직 못 깨운 글자는 화면 안에 두 번 이상 있도록 보정
  const need=unfilledChars(), count={};
  for(const b of blocks) if(reachable(b)) count[b.ch]=(count[b.ch]||0)+1;
  const spare=shuffle(blocks.filter(b=>reachable(b)&&HANGUL.test(b.ch)&&!need.includes(b.ch)));
  for(const ch of need){
    while((count[ch]||0)<2&&spare.length){spare.pop().ch=ch;count[ch]=(count[ch]||0)+1;}
  }
  const tokens=[], rr=B*.17;
  for(const b of blocks){
    if(!away(b)) continue;
    if(HANGUL.test(b.ch)){
      const blk={syl:b.ch,left:0,ci:-1};
      for(const p of layout(b.ch)){
        tokens.push(mk(b.x+p.x*B,b.y+p.y*B,'jamo',p.j,rr*rand(.82,1.05),blk)); blk.left++;
      }
    }else if(b.ch===' '){
      if(Math.random()<ARROW_RATE[stage]*2.6) tokens.push(mk(b.x+B/2,b.y+B/2,'arrow',(Math.random()*8)|0,rr*rand(.85,1.05)));
    }else tokens.push(mk(b.x+B*.35,b.y+B*.72,'mark',b.ch,rr*.75));
  }
  // 화살표(정해진 방향)는 글자 사이사이에도 끼어 있습니다
  const extra=Math.round(blocks.length*ARROW_RATE[stage]*.35);
  for(let i=0;i<extra;i++){
    const b=pick(blocks); if(!away(b)) continue;
    tokens.push(mk(b.x+rand(.1,.9)*B,b.y+(Math.random()<.5?-.02:1.02)*B,'arrow',(Math.random()*8)|0,rr*rand(.75,.95)));
  }
  for(const t of tokens){t.born=t0; t.delay=reduce?0:Math.hypot(t.x-P.x,t.y-P.y)*.7+rand(0,120);}
  field=keep.concat(tokens);
}
function mk(x,y,kind,ch,r,block){
  return {x,y,vx:0,vy:0,kind,ch,r,r0:r,rT:r,ci:-1,state:'field',alpha:1,born:0,delay:0,lat:0,pop:0,block:block||null};
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- HUD ---------- */
function setupSlots(){
  slots=[]; const box=$('slots'); box.innerHTML='';
  for(const ch of BELIEF[stage]){
    const el=document.createElement('span');
    if(HANGUL.test(ch)){el.className='slot';el.textContent=ch;slots.push({ch,el,filled:false});}
    else if(ch===' ') el.className='gap';
    else {el.className='punc';el.textContent=ch;}
    box.appendChild(el);
  }
  $('stageNo').textContent=`${stage+1} / ${BELIEF.length}`; updateCount();
}
function updateCount(){const n=slots.filter(s=>s.filled).length;$('count').textContent=`깨운 글자 ${n} / ${slots.length}`;}
function fillSlot(ch,ci){
  const s=slots.find(s=>!s.filled&&s.ch===ch); if(!s) return false;
  s.filled=true; s.el.classList.add('on'); s.el.style.background=COLORS[ci].f; s.el.style.color=COLORS[ci].t;
  lastFill=now; updateCount(); return true;
}
let capTimer=0;
function caption(html,ms){
  const c=$('caption'); c.innerHTML=html; c.classList.add('show');
  clearTimeout(capTimer); capTimer=setTimeout(()=>c.classList.remove('show'),ms);
}

/* ---------- 흐름 ---------- */
function startStage(){
  setupSlots(); buildField(now); lastFill=now; advanced=false; state='play';
  $('hud').style.opacity=1;
  caption(`<small>${stage+1} / ${BELIEF.length}</small>${BELIEF[stage]}`,2600);
}
function startClear(){
  state='clear'; clearAt=now; advanced=false;
  for(const t of field){
    if(t.state!=='field') continue;
    const a=Math.atan2(t.y-P.y,t.x-P.x)+rand(-.5,.5), v=rand(3,11)*(reduce?.3:1);
    t.vx=Math.cos(a)*v; t.vy=Math.sin(a)*v; t.fading=true;
  }
  if(stage<BELIEF.length-1) caption('틀이 부서집니다',1100);
}
function toEnd(){
  state='end';
  for(const t of swarm){t.state='free';t.vx=rand(-2,2);t.vy=rand(-2,2);field.push(t);}
  swarm=[];
  $('hud').style.opacity=0;
  $('endText').innerHTML=BELIEF.join('<br>');
  const p=$('endPanel'); p.style.display=''; requestAnimationFrame(()=>p.classList.remove('hide'));
  setTimeout(()=>p.classList.add('hide'),6500);
}
function restart(){
  const p=$('endPanel'); p.classList.add('hide'); setTimeout(()=>p.style.display='none',600);
  swarm=[]; field=[]; path=[]; stage=0; startStage();
}

/* ---------- 입력 ---------- */
addEventListener('pointermove',e=>{P.tx=e.clientX;P.ty=e.clientY;useKeys=false;});
addEventListener('pointerdown',e=>{P.tx=e.clientX;P.ty=e.clientY;useKeys=false;});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k)){e.preventDefault();keys.add(k);if(k!==' ')useKeys=true;}
  if(k==='enter'&&state==='intro') begin();
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
function begin(){
  if(state!=='intro') return;
  $('introPanel').classList.add('hide'); setTimeout(()=>$('introPanel').style.display='none',600);
  startStage();
}
$('startBtn').addEventListener('click',begin);
$('againBtn').addEventListener('click',restart);
addEventListener('resize',()=>{resize(); if(state==='play'||state==='intro') buildField(now);});

/* ---------- 격자 ---------- */
function rebuildGrid(){
  for(const c of grid) c.length=0;
  for(const t of field){
    const cx=clamp((t.x/CELL)|0,0,gc-1), cy=clamp((t.y/CELL)|0,0,gr-1);
    grid[cy*gc+cx].push(t);
  }
}
function near(x,y,rad,fn){
  const x0=clamp(((x-rad)/CELL)|0,0,gc-1),x1=clamp(((x+rad)/CELL)|0,0,gc-1);
  const y0=clamp(((y-rad)/CELL)|0,0,gr-1),y1=clamp(((y+rad)/CELL)|0,0,gr-1);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++)for(const t of grid[cy*gc+cx])fn(t);
}

/* ---------- 업데이트 ---------- */
function updatePlayer(f){
  if(useKeys){
    let kx=0,ky=0;
    if(keys.has('arrowleft')||keys.has('a'))kx--; if(keys.has('arrowright')||keys.has('d'))kx++;
    if(keys.has('arrowup')||keys.has('w'))ky--; if(keys.has('arrowdown')||keys.has('s'))ky++;
    const l=Math.hypot(kx,ky)||1; P.tx=P.x+kx/l*90; P.ty=P.y+ky/l*90;
  }
  let dx=(P.tx-P.x)*.14, dy=(P.ty-P.y)*.14; const l=Math.hypot(dx,dy), m=15;
  if(l>m){dx*=m/l;dy*=m/l;}
  dx+=P.kx; dy+=P.ky; P.kx*=Math.pow(.9,f); P.ky*=Math.pow(.9,f);
  P.vx=dx; P.vy=dy;
  P.x=clamp(P.x+dx*f,R,W-R); P.y=clamp(P.y+dy*f,R,H-R);
  const sp=Math.hypot(P.vx,P.vy);
  const lx=sp>.4?P.vx/sp:(P.tx-P.x)/(Math.hypot(P.tx-P.x,P.ty-P.y)||1)*.4;
  const ly=sp>.4?P.vy/sp:(P.ty-P.y)/(Math.hypot(P.tx-P.x,P.ty-P.y)||1)*.4;
  P.look.x+=(lx-P.look.x)*.15; P.look.y+=(ly-P.look.y)*.15;
  if(now>P.nextBlink){P.blink=1;P.nextBlink=now+rand(1800,5200);}
  P.blink=Math.max(0,P.blink-.12*f);

  // 자취(경로) 기록
  if(!path.length) path.push({x:P.x,y:P.y});
  let h=path[0], d=Math.hypot(P.x-h.x,P.y-h.y);
  while(d>=STEP){
    const nx=h.x+(P.x-h.x)/d*STEP, ny=h.y+(P.y-h.y)/d*STEP;
    path.unshift({x:nx,y:ny}); h=path[0]; d=Math.hypot(P.x-h.x,P.y-h.y);
  }
  const maxLen=Math.ceil((40+SWARM_CAP*2.7)/STEP)+20;
  if(path.length>maxLen) path.length=maxLen;
}

function collect(t){
  t.dead=true; t.state='swarm';
  const b=t.block;
  if(b){ if(b.ci<0) b.ci=pick(COLOR_BAG); t.ci=b.ci; b.left--; }   // 같은 음절의 자모는 같은 색
  else t.ci=t.kind==='arrow'?pick([4,5,4]):pick(COLOR_BAG);
  t.rT=t.r0*(t.kind==='arrow'?1.25:rand(1.35,1.7));
  t.lat=rand(-1,1); t.pop=1; t.alpha=1;
  swarm.unshift(t);
  if(t.kind==='arrow'){const d=DIRS[t.ch]; P.kx+=d.x*9; P.ky+=d.y*9;}
  // 한 음절의 자모를 모두 깨우면 그 음절이 문장에 채워집니다
  if(b&&b.left===0&&state==='play'&&fillSlot(b.syl,b.ci)&&slots.every(s=>s.filled)) startClear();
}

function updateField(f){
  const playing=state==='play';
  const cr=R*.9;
  near(P.x,P.y,R+30,t=>{
    if(t.dead) return;
    const dx=t.x-P.x, dy=t.y-P.y, d=Math.hypot(dx,dy)||.01;
    if(playing&&t.state==='field'&&!t.fading&&appear(t)>.9&&d<cr+t.r*.6){collect(t);return;}
    const min=R+t.r*.85;
    if(d<min){const o=(min-d)/d*.5; t.vx+=dx*o; t.vy+=dy*o;}
  });
  if(playing||state==='clear') field=field.filter(t=>!t.dead);

  for(const s of swarm){
    near(s.x,s.y,s.r+20,t=>{
      const dx=t.x-s.x, dy=t.y-s.y, d=Math.hypot(dx,dy)||.01, min=(s.r+t.r)*.92;
      if(d<min){const o=(min-d)/d*.28; t.vx+=dx*o; t.vy+=dy*o;}
    });
  }
  let anyDead=false;
  for(const t of field){
    if(t.state==='free'){
      t.vx+=rand(-.05,.05)*f; t.vy+=rand(-.05,.05)*f;
      if(t.x<t.r){t.x=t.r;t.vx=Math.abs(t.vx);} if(t.x>W-t.r){t.x=W-t.r;t.vx=-Math.abs(t.vx);}
      if(t.y<t.r){t.y=t.r;t.vy=Math.abs(t.vy);} if(t.y>H-t.r){t.y=H-t.r;t.vy=-Math.abs(t.vy);}
      const k=Math.pow(.985,f); t.vx*=k; t.vy*=k;
    }else{
      const k=Math.pow(t.fading?.95:.86,f); t.vx*=k; t.vy*=k;
      if(Math.abs(t.vx)<.01)t.vx=0; if(Math.abs(t.vy)<.01)t.vy=0;
    }
    t.x+=t.vx*f; t.y+=t.vy*f;
    t.r+=(t.rT-t.r)*.12*f;
    if(t.fading){t.alpha-=.016*f; if(t.alpha<=0){t.dead=true;anyDead=true;}}
  }
  if(anyDead) field=field.filter(t=>!t.dead);
}

function updateSwarm(f){
  // 꼬리가 너무 길면 끝부분은 그 자리에 자취로 남깁니다
  while(swarm.length>SWARM_CAP){
    const o=swarm.pop(); o.state='trace'; o.dead=false; o.vx*=.3; o.vy*=.3; o.rT=o.r0*1.15; field.push(o);
  }
  let traces=field.filter(t=>t.state==='trace');
  if(traces.length>TRACE_CAP){const drop=new Set(traces.slice(0,traces.length-TRACE_CAP));field=field.filter(t=>!drop.has(t));}

  const n=swarm.length, last=path.length-1;
  for(let i=0;i<n;i++){
    const s=swarm[i];
    const idx=Math.min(last,Math.floor((R*.9+i*2.7)/STEP));
    const p=path[idx], q=path[Math.min(last,idx+3)];
    let nx=0,ny=0; if(p!==q){const dx=p.x-q.x,dy=p.y-q.y,l=Math.hypot(dx,dy)||1;nx=-dy/l;ny=dx/l;}
    const w=10+Math.min(i,80)*.22;
    const tx=p.x+nx*s.lat*w, ty=p.y+ny*s.lat*w;
    s.vx+=(tx-s.x)*.03*f; s.vy+=(ty-s.y)*.03*f;
    // 털뭉치에서 밀려나기
    const dx=s.x-P.x, dy=s.y-P.y, d=Math.hypot(dx,dy)||.01, min=R*.85+s.r;
    if(d<min){const o=(min-d)/d*.3; s.vx+=dx*o; s.vy+=dy*o;}
  }
  for(let i=0;i<n;i++){
    const a=swarm[i];
    for(let j=i+1;j<n;j++){
      const b=swarm[j], dx=b.x-a.x, dy=b.y-a.y;
      if(Math.abs(dx)>40||Math.abs(dy)>40) continue;
      const d=Math.hypot(dx,dy)||.01, min=(a.r+b.r)*.86;
      if(d<min){const o=(min-d)/d*.18; a.vx-=dx*o; a.vy-=dy*o; b.vx+=dx*o; b.vy+=dy*o;}
    }
  }
  const k=Math.pow(.8,f);
  for(const s of swarm){
    s.vx*=k; s.vy*=k; s.x+=s.vx*f; s.y+=s.vy*f;
    s.r+=(s.rT-s.r)*.15*f; s.pop=Math.max(0,s.pop-.06*f);
  }
}

/* ---------- 그리기 ---------- */
const appear=t=>{if(!t.born) return 1; const p=clamp((now-t.born-t.delay)/420,0,1); return p===1?1:easeBack(p);};
function easeBack(x){const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}

function drawTok(t,extra){
  const s=appear(t); if(s<=0) return;
  const r=t.r*s*(1+(t.pop||0)*.35)*(extra||1); const size=SPR*r/RS;
  ctx.globalAlpha=t.alpha;
  ctx.drawImage(sprite(t.kind,t.ch,t.ci),t.x-size/2,t.y-size/2,size,size);
}

function drawPlayer(){
  const {x,y}=P, wob=now*.006;
  ctx.globalAlpha=1;
  ctx.strokeStyle='#0d0d0d'; ctx.lineWidth=1.6; ctx.lineCap='round';
  ctx.beginPath();
  for(const s of spikes){
    const l=R*(s.l+Math.sin(wob+s.w)*.05+(reduce?0:Math.random()*.05));
    ctx.moveTo(x+Math.cos(s.a)*R*.6,y+Math.sin(s.a)*R*.6);
    ctx.lineTo(x+Math.cos(s.a)*l,y+Math.sin(s.a)*l);
  }
  ctx.stroke();
  ctx.fillStyle='#0d0d0d'; ctx.beginPath(); ctx.arc(x,y,R*.9,0,Math.PI*2); ctx.fill();
  const ex=P.look.x*R*.12, ey=P.look.y*R*.12, open=1-Math.sin(P.blink*Math.PI)*.9;
  for(const sx of [-1,1]){
    const cx=x+sx*R*.3+ex, cy=y-R*.02+ey;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(1,open);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,R*.29,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0d0d0d'; ctx.beginPath(); ctx.arc(P.look.x*R*.08,P.look.y*R*.08,R*.15,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha=1; ctx.fillStyle='#e8e8e6'; ctx.fillRect(0,0,W,H);

  const hint=state==='play'&&(keys.has(' ')||now-lastFill>9000);
  const need=hint?new Set(unfilledChars()):null;
  for(const t of field) if(t.state==='field') drawTok(t);
  if(need){
    const a=.35+.35*Math.sin(now*.006);
    ctx.lineWidth=2;
    for(const t of field){
      if(t.state!=='field'||!t.block||!need.has(t.block.syl)) continue;
      ctx.globalAlpha=a; ctx.strokeStyle='#e0559f';
      ctx.beginPath(); ctx.arc(t.x,t.y,t.r+4,0,Math.PI*2); ctx.stroke();
    }
  }
  for(const t of field) if(t.state==='trace'||t.state==='free') drawTok(t);
  for(let i=swarm.length-1;i>=0;i--) drawTok(swarm[i]);
  drawPlayer();
  ctx.globalAlpha=1;
}

/* ---------- 루프 ---------- */
let prev=performance.now();
function loop(t){
  now=t; const f=Math.min(2.4,(t-prev)/16.67); prev=t;
  updatePlayer(f);
  rebuildGrid();
  updateField(f);
  updateSwarm(f);
  if(state==='clear'&&!advanced&&now-clearAt>1300){
    advanced=true;
    if(stage<BELIEF.length-1){stage++; startStage();}
    else toEnd();
  }
  draw();
  requestAnimationFrame(loop);
}

resize();
P.x=P.tx=W/2; P.y=P.ty=H/2;
setupSlots(); buildField(performance.now());
requestAnimationFrame(loop);
})();
</script>
